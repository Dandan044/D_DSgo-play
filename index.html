<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小肥鲸 · 风铃庭院</title>
  <link rel="stylesheet" href="style.css?v=7814e62e583e">
</head>
<body>
<main class="app">
  <header>
    <div class="brand"><span class="brand-mark">⌁</span><div><h1>小肥鲸的冒险</h1><p>风铃庭院 <span>·</span> 动作试玩</p></div></div>
    <div class="top-actions"><span class="local-badge"><i></i>自由练习</span><button id="restart" title="回到起点（R）">↺ <span>重新开始</span></button><button id="fullscreen" title="全屏">⛶ <span>全屏</span></button></div>
  </header>
  <section class="game-shell" aria-label="小肥鲸动作试玩">
    <canvas id="game" width="1280" height="720" tabindex="0" aria-label="游戏场景：A和D移动，空格跳跃，S下蹲，Shift冲刺，按住鼠标左键瞄准射击。点击场景后使用键盘。"></canvas>
    <div class="scene-heading"><span class="eyebrow">THE WIND CHIME GARDEN</span><h2>风铃庭院</h2><p>先散个步，再去冒险。</p></div>
    <div class="scene-status"><span class="status-dot"></span><output id="action">准备出发</output></div>
    <div id="toast" role="status"></div>
    <div id="overlay" class="overlay">
      <div class="welcome"><span class="welcome-icon">✦</span><p class="eyebrow">一小段午后散步</p><h2 id="overlay-title">准备好出发了吗？</h2><p id="overlay-copy">跳过石阶，抱头钻过花架。<br>试试 Shift 冲刺，按住鼠标左键发射蓝色子弹。</p><button id="play">开始散步 <span>→</span></button><p class="focus-note">点击开始后，用键盘控制小肥鲸</p></div>
    </div>
    <div class="journey" aria-label="练习进度"><span id="task-move">○ 移动</span><span id="task-jump">○ 跳跃</span><span id="task-crouch">○ 抱头蹲</span><div class="track"><i id="progress"></i></div><span id="place">庭院入口</span></div>
    <div class="touch-controls" aria-label="触屏控制"><div><button data-key="left" aria-label="向左移动">←</button><button data-key="right" aria-label="向右移动">→</button></div><div><button data-key="crouch" aria-label="下蹲">蹲</button><button data-key="dash" aria-label="冲刺">冲</button><button data-key="jump" aria-label="跳跃">跳</button></div></div>
    <div id="loading">正在唤醒小肥鲸…</div>
  </section>
  <footer><div class="key-group"><span><kbd>A</kbd><kbd>D</kbd> 左右移动</span><span><kbd>Space</kbd> 跳跃</span><span><kbd>S</kbd> 抱头蹲 <small>＋ A / D 蹲行</small></span><span><kbd>Shift</kbd> 冲刺</span><span><kbd>鼠标左键</kbd> 射击</span></div><span class="extra-keys"><kbd>Esc</kbd> 暂停 <b>·</b> <kbd>R</kbd> 回到起点</span></footer>
</main>
<script src="physics.js?v=1daf02a587ff"></script><script src="combat.js?v=60207601e7c6"></script><script src="face.js?v=b1435c192ea1"></script><script src="idle.js?v=e013d2d83b1b"></script><script src="assets/actions.js?v=e3e07e582cc1"></script><script src="assets/expressions.js?v=57e6bdb0fad7"></script><script src="game.js?v=8f8c5c067194"></script>
</body>
</html>
